<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BookBuddy - Offline</title>
    <meta name="theme-color" content="#6d28d9">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        :root {
            --bg-light: #f8fafc;
            --text-light: #0f172a;
            --card-light: #ffffff;
            --border-light: #e2e8f0;
            --sub-light: #64748b;
            
            --bg-dark: #020617;
            --text-dark: #f8fafc;
            --card-dark: #0f172a;
            --border-dark: #1e293b;
            --sub-dark: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 1.5rem;
            transition: background-color 0.2s, color 0.2s;
        }

        html.dark body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-light);
            border: 1px solid var(--border-light);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        html.dark .container {
            background: var(--card-dark);
            border-color: var(--border-dark);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            color: #ffffff;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.95rem;
            color: var(--sub-light);
            margin: 0 0 1.75rem;
            line-height: 1.5;
        }

        html.dark p {
            color: var(--sub-dark);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-badge">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a5 5 0 010-7.072m-2.829-2.829a9 9 0 000 12.728M5.636 5.636L3 3" />
            </svg>
        </div>
        <h1>You are Offline</h1>
        <p>BookBuddy requires an active internet connection to process book summaries and AI conversations. Please check your connection and try again.</p>
        <button class="btn" onclick="window.location.reload()">
            <svg style="width:18px;height:18px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Try Reconnecting
        </button>
    </div>
</body>
</html>
